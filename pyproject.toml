[project]
name = "squelch-skills"
version = "0.1.0a0"
description = "Experimental system for measuring interference between agent skills and testing composition strategies."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Squelch project" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
squelch = "squelch.cli:app"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squelch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: tests requiring a working Docker daemon (skipped when absent, reported as skipped, never as passed)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's declarative Option/Argument defaults are the documented idiom
"src/squelch/cli.py" = ["B008"]
